<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iA.Book - Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/globals.css" rel="stylesheet">
</head>
<body>
<div class="auth-container">
    <!-- Назад -->
    <button class="auth-back-btn" onclick="window.location.href='/'">
        <img th:src="@{/img/vector-10.svg}" alt="Назад" class="me-2" width="20">
        <span>Назад</span>
    </button>
    <div class="auth-form-section">
        <div class="auth-logo">
            <img th:src="@{/img/vector.svg}" alt="Логотип" width="30">
            <h1>iA.Book</h1>
        </div>

        <!-- Ошибки -->
        <div th:if="${param.error}" class="auth-error-message">
            Неверный логин или пароль
        </div>

        <div class="auth-header">
            <h2>Добро пожаловать в iA.Book</h2>
            <p>Пожалуйста, введите ваши данные для входа</p>
        </div>

        <!-- Форма входа -->
        <form th:action="@{/login}" method="post">
            <!-- Поле логина -->
            <div class="auth-input-group">
                <label for="username" class="auth-input-label">Логин</label>
                <input type="text" class="auth-input-field"
                       id="username" name="username" placeholder="Daphne Smith" required>
            </div>
            <!-- Поле пароля -->
            <div class="auth-input-group">
                <label for="password" class="auth-input-label">Пароль</label>
                <input type="password" class="auth-input-field"
                       id="password" name="password" placeholder="**************" required>
            </div>
            <!-- Кнопка входа -->
            <input type="hidden" name="redirect" th:value="${param.redirect} ?: ''">
            <button type="submit" class="auth-submit-btn">Войти</button>
            <!-- Регистрация -->
            <p class="auth-switch-form">
                Нет аккаунта?
                <a th:href="@{/register}" class="text-primary">Зарегистрироваться</a>
            </p>
        </form>
    </div>

    <!-- ФОНН -->
    <div class="auth-image-section" style="background-image: url('/img/03-sky-2.png');"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
