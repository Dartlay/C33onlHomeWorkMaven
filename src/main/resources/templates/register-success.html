<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iA.Book - Регистрация успешна</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            overflow: hidden;
            height: 100vh;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            font-size: 72px;
            color: #28a745;
            margin-bottom: 20px;
        }

        .btn-continue {
            border-radius: 100px;
            height: 50px;
        }
    </style>
</head>
<body>
<div class="success-container">
    <div class="success-icon">✓</div>
    <h2 class="mb-3">Регистрация успешна!</h2>
    <p class="text-muted mb-4">Ваш аккаунт был успешно создан. Теперь вы можете войти в систему.</p>
    <a th:href="@{/login}" class="btn btn-dark w-100 btn-continue">Перейти к входу</a>
</div>
</body>
<script>
    // Проверяем, есть ли токен
    if (!localStorage.getItem('jwtToken')) {
        window.location.href = '/register';
    } else {
        // Перенаправляем через 3 секунды
        setTimeout(() => {
            window.location.href = '/book';
        }, 3000);
    }
</script>
</html>
