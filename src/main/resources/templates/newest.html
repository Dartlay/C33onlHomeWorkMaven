<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iA.Book - Новинки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Не забудь вынести в css-->
    <style>
        :root {
            --gray-500: #666666;
            --gray-600: #494759;
            --gray-900: #212121;
            --orange-btn: #F87132;
        }

        .book-image {
            max-height: 300px;
            object-fit: contain;
            margin-bottom: 15px;
            width: 100%;
        }

        .book-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--gray-900);
        }

        .book-author {
            color: var(--gray-500);
            margin-bottom: 5px;
        }

        .book-description {
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: var(--gray-600);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }


        .navbar-brand {
            font-weight: bold;
        }

        .nav-link {
            font-weight: 500;
        }

        .book-card1 {
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);

        }

        .btn-primary {
            background-color: var(--gray-600);
            border-color: var(--gray-600);
        }

        .btn-primary:hover {
            background-color: var(--gray-900);
            border-color: var(--gray-900);
        }

        .btn-outline-primary {
            color: var(--gray-600);
            border-color: var(--gray-600);
        }

        .btn-outline-primary:hover {
            background-color: var(--gray-600);
            border-color: var(--gray-600);
            color: white;
        }

        .btn-outline-secondary {
            color: var(--gray-500);
            border-color: var(--gray-500);
        }

        .btn-outline-secondary:hover {
            background-color: var(--gray-500);
            border-color: var(--gray-500);
            color: white;
        }

        .btn-success {
            background-color: var(--orange-btn);
            border-color: var(--orange-btn);
        }

        .btn-success:hover {
            background-color: #e05d22;
            border-color: #e05d22;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/book">
            <img src="/img/vector.svg" alt="Логотип" style="height: 30px; margin-right: 10px;"
                 onerror="this.src='/img/default-logo.png'">
            <span>iA.Book</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/book">Книги</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/newest">Новинки</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/top10">Топ 10</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/library">Библиотека</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <div th:if="${isAuthenticated}">
                    <span class="me-3">Привет, <span th:text="${username}"></span></span>
                    <a href="/logout" class="btn btn-outline-danger">Выйти</a>
                </div>
                <div th:unless="${isAuthenticated}">
                    <a href="/login" class="btn btn-outline-primary me-2">Вход</a>
                    <a href="/register" class="btn btn-primary">Регистрация</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <h1 class="mb-4">Новинки</h1>

    <!-- Проверка -->
    <div th:if="${books != null and not books.empty}" class="row">
        <div class="row">
            <div th:each="book : ${books}" class="col-md-4 mb-4">
                <div class="book-card1 position-relative">
                    <div class="badge-new">НОВИНКА</div>

                    <!-- Обложка -->
                    <img th:src="@{'/api/books/' + ${book.id} + '/cover'}"
                         class="book-image mb-3"
                         alt="Обложка книги"
                         th:onerror="this.src='/img/default-cover.png'">

                    <!-- Инфо -->
                    <h5 class="book-title" th:text="${book?.title} ?: 'Без названия'"></h5>
                    <div class="book-author" th:text="${book?.author?.name} ?: 'Автор неизвестен'"></div>
                    <div class="book-genre" th:text="${book?.genre?.name} ?: 'Жанр не указан'"></div>

                    <!-- Описание  в 3 строки -->
                    <p class="book-description" th:text="${book?.description} ?: 'Описание отсутствует'"></p>
                    <!-- Кнопки-->
                    <div class="d-flex flex-wrap mt-3">
                        <a th:href="@{'/read/' + ${book.id}}"
                           th:if="${book?.filePath != null}"
                           class="btn btn-primary me-2 mb-2">
                            Читать онлайн
                        </a>
                        <a th:href="@{'/api/books/' + ${book.id} + '/download'}"
                           class="btn btn-outline-secondary me-2 mb-2">
                            Скачать
                        </a>
                        <form th:if="${isAuthenticated}"
                              th:action="@{/add-to-library}"
                              method="post"
                              class="d-inline">
                            <input type="hidden" name="bookId" th:value="${book?.id}">
                            <button type="submit" class="btn btn-success mb-2">
                                <i class="bi bi-plus-circle"></i> В библиотеку
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Если null -->
    <div th:if="${books == null or books.empty}" class="alert alert-info">
        Новых книг пока нет
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
