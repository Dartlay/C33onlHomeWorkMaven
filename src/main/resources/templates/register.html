<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iA.Book - Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/globals.css" rel="stylesheet">
</head>
<body>
<div class="auth-container">
    <!-- Кнопка Назад -->
    <button class="auth-back-btn" onclick="window.location.href='/'">
        <img th:src="@{/img/vector-10.svg}" alt="Назад" class="me-2" width="20">
        <span>Назад</span>
    </button>

    <!-- Левая часть - форма -->
    <div class="auth-form-section">
        <div class="auth-logo">
            <img th:src="@{/img/vector.svg}" alt="Логотип" width="30">
            <h1>iA.Book</h1>
        </div>

        <!-- Сообщение об ошибке -->
        <div id="errorMessage" class="auth-error-message d-none"></div>

        <div class="auth-header">
            <h2>Создайте аккаунт</h2>
            <p>Пожалуйста, заполните все поля для регистрации</p>
        </div>

        <!-- Форма регистрации -->
        <form id="registerForm">
            <!-- Поле логина -->
            <div class="auth-input-group">
                <label for="username" class="auth-input-label">Логин</label>
                <input type="text" class="auth-input-field"
                       id="username" name="username" placeholder="Придумайте логин" required>
                <div class="invalid-feedback" id="usernameError"></div>
            </div>

            <!-- Поле email -->
            <div class="auth-input-group">
                <label for="email" class="auth-input-label">Email</label>
                <input type="email" class="auth-input-field"
                       id="email" name="email" placeholder="Ваш email" required>
                <div class="invalid-feedback" id="emailError"></div>
            </div>

            <!-- Поле пароля -->
            <div class="auth-input-group">
                <label for="password" class="auth-input-label">Пароль</label>
                <input type="password" class="auth-input-field"
                       id="password" name="password" placeholder="Придумайте пароль" required
                       oninput="validatePassword(this.value)">
                <div class="invalid-feedback" id="passwordError"></div>
                <div class="password-hint">
                    Пароль должен содержать: 8+ символов, заглавные/строчные буквы, цифры и спецсимволы (@$!%*?&).
                </div>
            </div>

            <!-- Подтверждение пароля -->
            <div class="auth-input-group">
                <label for="confirmPassword" class="auth-input-label">Подтвердите пароль</label>
                <input type="password" class="auth-input-field"
                       id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль" required>
                <div class="invalid-feedback" id="confirmPasswordError"></div>
            </div>

            <!-- Кнопка регистрации -->
            <button type="submit" class="auth-submit-btn">Зарегистрироваться</button>

            <!-- Ссылка на вход -->
            <p class="auth-switch-form">
                Уже есть аккаунт?
                <a th:href="@{/login}" class="text-primary">Войти</a>
            </p>
        </form>
    </div>

    <!-- Правая часть - изображение -->
    <div class="auth-image-section" style="background-image: url('/img/03-sky-2.png');"></div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        // Сброс ошибок
        document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
        document.getElementById('errorMessage').classList.add('d-none');

        const formData = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        const confirmPassword = document.getElementById('confirmPassword').value;

        // Проверка совпадения паролей
        if (formData.password !== confirmPassword) {
            document.getElementById('confirmPassword').classList.add('is-invalid');
            document.getElementById('confirmPasswordError').textContent = 'Пароли не совпадают';
            return;
        }

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });

            const data = await response.json();

            if (response.ok) {
                window.location.href = '/register-success';
            } else {
                if (data.errors) {
                    Object.entries(data.errors).forEach(([field, message]) => {
                        const input = document.getElementById(field);
                        if (input) {
                            input.classList.add('is-invalid');
                            document.getElementById(`${field}Error`).textContent = message;
                        }
                    });
                } else {
                    document.getElementById('errorMessage').textContent =
                        data.message || 'Ошибка регистрации';
                    document.getElementById('errorMessage').classList.remove('d-none');
                }
            }
        } catch (error) {
            document.getElementById('errorMessage').textContent =
                'Произошла ошибка при отправке запроса';
            document.getElementById('errorMessage').classList.remove('d-none');
            console.error('Error:', error);
        }
    });

    function validatePassword(password) {
        // Простая валидация (можно расширить)
        const isStrong = password.length >= 8 &&
            /[A-Z]/.test(password) &&
            /[a-z]/.test(password) &&
            /\d/.test(password) &&
            /[@$!%*?&]/.test(password);

        const input = document.getElementById('password');
        if (password.length > 0 && !isStrong) {
            input.classList.add('is-invalid');
            document.getElementById('passwordError').textContent = 'Пароль слишком слабый';
        } else {
            input.classList.remove('is-invalid');
            document.getElementById('passwordError').textContent = '';
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
