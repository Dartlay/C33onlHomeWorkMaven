<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Чтение книги - [[${book.title}]]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Не забудь вынести в css-->
    <style>
        .reader-container {
            height: 100vh;
            width: 100%;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        .header {
            padding: 10px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="container">
        <h2>[[${book.title}]]</h2>
        <a href="/book" class="btn btn-secondary">Вернуться к списку книг</a>
    </div>
</div>

<div class="reader-container">
    <!-- Для PDF используем встроенный просмотрщик -->
    <div th:if="${isPdf}">
        <iframe class="pdf-viewer" th:src="@{${readUrl}}"></iframe>
    </div>

    <!-- Для других форматов предлагаем скачать -->
    <div th:unless="${isPdf}" class="container mt-5 text-center">
        <div class="alert alert-info">
            <h4>Этот формат книги не поддерживает онлайн-чтение</h4>
            <p>Пожалуйста, скачайте книгу для чтения в подходящем приложении</p>
            <a th:href="@{'/api/books/' + ${book.id} + '/download'}"
               class="btn btn-primary">Скачать книгу</a>
        </div>
    </div>
</div>
</body>
</html>
