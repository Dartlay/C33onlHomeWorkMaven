<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Tours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Available Tours</h1>

    <div th:if="${message}" class="alert alert-info" role="alert" th:text="${message}"></div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Price ($)</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tour : ${tours}">
            <td th:text="${tour.name}"></td>
            <td th:text="${tour.price}"></td>
            <td>
                <form th:action="@{/tours/book}" method="post">
                    <input type="hidden" name="name" th:value="${tour.name}"/>
                    <button type="submit" class="btn btn-primary btn-sm">Book</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
