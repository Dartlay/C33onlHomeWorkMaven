<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Admin Panel</a>
        <div class="navbar-text ms-auto">
            Welcome, <span th:text="${username}"></span> |
            <a href="/logout" class="text-white ms-2">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-3">
            <div class="list-group">
                <a href="/admin" class="list-group-item list-group-item-action">Dashboard</a>
                <a href="/admin/books" class="list-group-item list-group-item-action active">Books</a>
                <a href="/admin/users" class="list-group-item list-group-item-action">Users</a>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card">
                <div class="card-header">
                    <h4>Edit Book</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/books/edit/{id}(id=${book.id})}" method="post"
                          enctype="multipart/form-data">
                        <input type="hidden" name="_method" value="put">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" th:value="${book.title}"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label for="author" class="form-label">Author</label>
                            <input type="text" class="form-control" id="author" name="authorName"
                                   th:value="${book.author != null} ? ${book.author.name} : ''" required>
                        </div>
                        <div class="mb-3">
                            <label for="genre" class="form-label">Genre</label>
                            <input type="text" class="form-control" id="genre" name="genreName"
                                   th:value="${book.genre != null} ? ${book.genre.name} : ''" required>
                        </div>
                        <div class="mb-3">
                            <label for="year" class="form-label">Year</label>
                            <input type="number" class="form-control" id="year" name="year" th:value="${book.year}">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3"
                                      th:text="${book.description}"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Current File: <span th:text="${book.filePath}"></span></label>
                            <input type="file" class="form-control" id="file" name="file">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Current Cover:
                                <span th:if="${book.coverPath}" th:text="${book.coverPath}"></span>
                                <span th:unless="${book.coverPath}">No cover</span>
                            </label>
                            <input type="file" class="form-control" id="cover" name="cover">
                        </div>
                        <button type="submit" class="btn btn-primary">Update Book</button>
                        <a href="/admin/books" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
