<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Admin Panel</a>
        <div class="navbar-text ms-auto">
            Welcome, <span th:text="${username}"></span> |
            <a href="/logout" class="text-white ms-2">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-3">
            <div class="list-group">
                <a href="/admin" class="list-group-item list-group-item-action">Dashboard</a>
                <a href="/admin/books" class="list-group-item list-group-item-action">Books</a>
                <a href="/admin/users" class="list-group-item list-group-item-action active">Users</a>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card">
                <div class="card-header">
                    <h4>Confirm User Deletion</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger">
                        <strong>Warning!</strong> You are about to delete user:
                        <strong th:text="${user.username}"></strong> (ID: <span th:text="${user.id}"></span>)
                    </div>
                    <p>This action cannot be undone. All data associated with this user will be permanently deleted.</p>

                    <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post">
                        <input type="hidden" name="_method" value="delete">
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="confirm" name="confirm" required>
                            <label class="form-check-label" for="confirm">I understand the consequences</label>
                        </div>
                        <button type="submit" class="btn btn-danger">Delete Permanently</button>
                        <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
