<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iA.Book - Моя библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Не забудь вынести в css-->
    <style>
        :root {
            --gray-500: #666666;
            --gray-600: #494759;
            --gray-900: #212121;
            --orange-btn: #F87132;
        }

        .book-card {
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            height: 100%;
            transition: all 0.3s ease;
        }

        .book-image {
            max-height: 300px;
            object-fit: contain;
            margin-bottom: 15px;
            width: 100%;
            background-color: #f8f9fa;
            border-radius: 5px;
        }

        .book-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--gray-900);
        }

        .book-author {
            color: var(--gray-500);
            margin-bottom: 5px;
        }

        .empty-library {
            text-align: center;
            padding: 100px 0;
        }

        .empty-library img {
            max-width: 300px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .action-btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: var(--gray-600);
            border-color: var(--gray-600);
        }

        .btn-primary:hover {
            background-color: var(--gray-900);
            border-color: var(--gray-900);
        }

        .btn-outline-secondary {
            color: var(--gray-500);
            border-color: var(--gray-500);
        }

        .btn-outline-secondary:hover {
            background-color: var(--gray-500);
            border-color: var(--gray-500);
            color: white;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
    </style>
</head>
<body>
<!-- Навбар -->
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/book">
            <img src="/img/vector.svg" alt="Логотип" style="height: 30px; margin-right: 10px;">
            <span>iA.Book</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/book">Книги</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/library">Библиотека</a>
                </li>
            </ul>
            <div th:if="${isAuthenticated}" class="d-flex align-items-center">
                <span class="me-3">Привет, <span th:text="${username}"></span></span>
                <a href="/logout" class="btn btn-outline-danger">Выйти</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <!-- Пермишен -->
    <div th:if="${success}" class="alert alert-success mt-3">
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger mt-3">
        <span th:text="${error}"></span>
    </div>

    <div th:if="${books.isEmpty()}">
        <div class="empty-library">
            <img src="/img/default-cover.png" alt="Библиотека пуста">
            <h3 class="mb-3">Ваша библиотека пуста</h3>
            <a href="/book" class="btn btn-primary">Найти книги</a>
        </div>
    </div>

    <div th:unless="${books.isEmpty()}">
        <h1>Моя библиотека</h1>
        <div class="row">
            <div th:each="book : ${books}" class="col-md-6 col-lg-4 col-xl-3">
                <div class="book-card">
                    <!-- Обложка книги -->
                    <img th:if="${book.coverPath != null}"
                         th:src="@{'/api/books/' + ${book.id} + '/cover'}"
                         class="img-fluid book-image"
                         alt="Обложка книги">
                    <img th:unless="${book.coverPath != null}"
                         src="/img/default-cover.png"
                         class="img-fluid book-image"
                         alt="Обложка по умолчанию">
                    <h5 class="book-title" th:text="${book.title}"></h5>
                    <div class="book-author" th:text="${book.author?.name ?: 'Автор неизвестен'}"></div>

                    <div class="d-flex flex-wrap">
                        <a th:href="@{'/read/' + ${book.id}}" class="btn btn-primary action-btn">Читать</a>
                        <a th:href="@{/api/books/{id}/download(id=${book.id})}"
                           class="btn btn-outline-secondary action-btn">Скачать</a>
                        <form th:action="@{/remove-from-library}" method="post" class="action-btn">
                            <input type="hidden" name="bookId" th:value="${book.id}">
                            <input type="hidden" name="confirm" value="true">
                            <button type="submit" class="btn btn-danger w-100">
                                Удалить
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Подвал -->
<footer class="footer mt-auto py-3 bg-light">
    <div class="container text-center">
        <p class="mb-0">© 2025 iA.Book. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
