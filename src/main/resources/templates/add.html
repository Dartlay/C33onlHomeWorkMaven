<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 class="mb-4">Add Student</h1>

<form th:action="@{/students/add}" th:object="${student}" method="post" class="mb-3">
    <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" th:field="*{firstName}" class="form-control" id="firstName" placeholder="Enter first name">
    </div>
    <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" th:field="*{lastName}" class="form-control" id="lastName" placeholder="Enter last name">
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <a th:href="@{/students}" class="btn btn-secondary">← Back</a>
</form>
</body>
</html>
