<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Students</h1>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
    <div th:if="${nameError}" class="alert alert-warning" th:text="${nameError}"></div>
    <div th:if="${surnameError}" class="alert alert-warning" th:text="${surnameError}"></div>

    <form method="get" th:action="@{/students}" class="mb-4">
        <div class="row align-items-center">
            <div class="col-auto">
                <label for="groupSelect" class="form-label fw-semibold">Select Group:</label>
            </div>
            <div class="col-auto">
                <select name="groupId" id="groupSelect" class="form-select" onchange="this.form.submit()">
                    <option th:each="group : ${groups}"
                            th:value="${group.id}"
                            th:selected="${group.id == selectedGroupId}"
                            th:text="${group.name}">
                    </option>
                </select>
            </div>
            <div class="col-auto">
                <label for="sortSelect" class="form-label fw-semibold">Sort By:</label>
            </div>
            <div class="col-auto">
                <select name="sort" id="sortSelect" class="form-select" onchange="this.form.submit()">
                    <option value="name" th:selected="${sort == 'name'}">Name</option>
                    <option value="surname" th:selected="${sort == 'surname'}">Surname</option>
                    <option value="email" th:selected="${sort == 'email'}">Email</option>
                    <option value="id" th:selected="${sort == 'id'}">ID</option>
                </select>
            </div>
        </div>
    </form>

    <form th:action="@{/students/add}" method="post" class="row g-3 mb-4">
        <input type="hidden" name="groupId" th:value="${selectedGroupId}"/>

        <div class="col-md-3">
            <input type="text" name="name" class="form-control"
                   placeholder="Name (Latin letters)" required
                   pattern="[a-zA-Z\s'-]+"
                   title="Latin letters only"
                   th:classappend="${nameError != null} ? 'is-invalid' : ''"
                   th:value="${nameValue != null} ? ${nameValue} : ''"/>
            <div th:if="${nameError}" class="invalid-feedback" th:text="${nameError}"></div>
        </div>

        <div class="col-md-3">
            <input type="text" name="surname" class="form-control"
                   placeholder="Surname (Latin letters)" required
                   pattern="[a-zA-Z\s'-]+"
                   title="Latin letters only"
                   th:classappend="${surnameError != null} ? 'is-invalid' : ''"
                   th:value="${surnameValue != null} ? ${surnameValue} : ''"/>
            <div th:if="${surnameError}" class="invalid-feedback" th:text="${surnameError}"></div>
        </div>

        <div class="col-md-3">
            <input type="email" name="email" class="form-control"
                   placeholder="Email" required
                   th:classappend="${emailError != null} ? 'is-invalid' : ''"
                   th:value="${emailValue != null} ? ${emailValue} : ''"/>
            <div th:if="${emailError}" class="invalid-feedback" th:text="${emailError}"></div>
        </div>

        <div class="col-md-3">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" name="hasPaid" id="hasPaid"
                       th:checked="${hasPaidValue != null} ? ${hasPaidValue} : false">
                <label class="form-check-label" for="hasPaid">Paid</label>
            </div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Add Student</button>
        </div>
    </form>

    <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Surname</th>
            <th>Email</th>
            <th>Paid</th>
            <th>Group</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.name}"></td>
            <td th:text="${student.surname}"></td>
            <td th:text="${student.email}"></td>
            <td>
                <span th:if="${student.hasPaid}" class="badge bg-success">Yes</span>
                <span th:if="${!student.hasPaid}" class="badge bg-danger">No</span>
            </td>
            <td th:text="${student.group.name}"></td>
            <td>
                <form th:action="@{/students/delete/{id}(id=${student.id})}" method="post">
                    <input type="hidden" name="groupId" th:value="${selectedGroupId}"/>
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mt-3">
        <a href="/students/upload" class="btn btn-secondary me-2">Upload Students</a>
        <a href="/students/download" class="btn btn-secondary">Download Students</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
