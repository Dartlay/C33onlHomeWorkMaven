<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Студенты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Студенты</h1>
    <form method="get" th:action="@{/students}" class="mb-4">
        <div class="row align-items-center">
            <div class="col-auto">
                <label for="groupSelect" class="form-label fw-semibold">Выберите группу:</label>
            </div>
            <div class="col-auto">
                <select name="groupId" id="groupSelect" class="form-select" onchange="this.form.submit()">
                    <option th:each="group : ${groups}"
                            th:value="${group.id}"
                            th:selected="${group.id == selectedGroupId}"
                            th:text="${group.name}">
                    </option>
                </select>
            </div>
            <div class="col-auto">
                <label for="sortSelect" class="form-label fw-semibold">Сортировка:</label>
            </div>
            <div class="col-auto">
                <select name="sort" id="sortSelect" class="form-select" onchange="this.form.submit()">
                    <option value="name" th:selected="${sort == 'name'}">По имени</option>
                    <option value="email" th:selected="${sort == 'email'}">По email</option>
                    <option value="id" th:selected="${sort == 'id'}">По ID</option>
                </select>
            </div>
        </div>
    </form>
    <form th:action="@{/students/add}" method="post" class="row g-3 mb-4">
        <input type="hidden" name="groupId" th:value="${selectedGroupId}"/>
        <div class="col-md-4">
            <input type="text" name="name" class="form-control" placeholder="Имя" required/>
        </div>
        <div class="col-md-4">
            <input type="email" name="email" class="form-control" placeholder="Email" required/>
        </div>
        <div class="col-md-4">
            <button type="submit" class="btn btn-primary w-100">Добавить студента</button>
        </div>
    </form>
    <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
        <tr>
            <th>Имя</th>
            <th>Email</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td>
                <form th:action="@{/students/delete/{id}(id=${student.id})}" method="post" th:object="${student}">
                    <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
