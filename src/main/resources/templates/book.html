<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iA.Book - Библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Не забудь вынести в css-->
    <style>
        :root {
            --gray-500: #666666;
            --gray-600: #494759;
            --gray-900: #212121;
            --orange-btn: #F87132;
        }

        .book-card {
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            height: 100%;
        }

        .book-image {
            max-height: 300px;
            object-fit: contain;
            margin-bottom: 15px;
            width: 100%;
        }

        .book-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--gray-900);
        }

        .book-author {
            color: var(--gray-500);
            margin-bottom: 5px;
        }

        .book-genres {
            font-size: 0.9rem;
            color: var(--gray-500);
            margin-bottom: 15px;
            font-style: italic;
        }

        .book-description {
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: var(--gray-600);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        .action-btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .nav-link {
            font-weight: 500;
        }

        .search-box {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .search-input {
            padding-left: 40px;
        }

        /* Стили кнопок */
        .btn-primary {
            background-color: var(--gray-600);
            border-color: var(--gray-600);
        }

        .btn-primary:hover {
            background-color: var(--gray-900);
            border-color: var(--gray-900);
        }

        .btn-outline-primary {
            color: var(--gray-600);
            border-color: var(--gray-600);
        }

        .btn-outline-primary:hover {
            background-color: var(--gray-600);
            border-color: var(--gray-600);
            color: white;
        }

        .btn-outline-secondary {
            color: var(--gray-500);
            border-color: var(--gray-500);
        }

        .btn-outline-secondary:hover {
            background-color: var(--gray-500);
            border-color: var(--gray-500);
            color: white;
        }

        .btn-success {
            background-color: var(--orange-btn);
            border-color: var(--orange-btn);
        }

        .btn-success:hover {
            background-color: #e05d22;
            border-color: #e05d22;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
    </style>
</head>
<body>
<!-- Нав бар -->
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/book">
            <img src="/img/vector.svg" alt="Логотип" style="height: 30px; margin-right: 10px;">
            <span>iA.Book</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/book">Книги</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/newest">Новинки</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/library">Библиотека</a>
                </li>
            </ul>
            <div class="search-box me-3">
                <form th:action="@{/book}" method="get" class="d-flex">
                    <i class="bi bi-search search-icon text-muted"></i>
                    <input class="form-control search-input" type="search"
                           name="search" placeholder="Поиск по названию, автору или году..."
                           th:value="${searchQuery}">
                </form>
            </div>

                <!-- вход/выход -->
                <div th:if="${isAuthenticated}">
                    <span class="me-3">Привет, <span th:text="${username}"></span></span>
                    <a href="/logout" class="btn btn-outline-danger">Выйти</a>
                </div>
                <div th:unless="${isAuthenticated}">
                    <a href="/login" class="btn btn-outline-primary me-2">Вход</a>
                    <a href="/register" class="btn btn-primary">Регистрация</a>
                </div>
            </div>
        </div>
    </div>
</nav>
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="filterModalLabel">Фильтры</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/book}" method="get">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Жанр</label>
                        <select class="form-select" name="genreId">
                            <option value="">Все жанры</option>
                            <option th:each="genre : ${genres}"
                                    th:value="${genre.id}"
                                    th:text="${genre.name}"
                                    th:selected="${genre.id == selectedGenreId}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                    <button type="submit" class="btn btn-primary">Применить фильтр</button>
                    <a th:href="@{/book}" class="btn btn-outline-danger">Сбросить</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:if="${#strings.length(#strings.trim(success)) > 0}"
     class="alert alert-success mt-3">
    <span th:text="${success}"></span>
</div>
<div th:if="${#strings.length(#strings.trim(error)) > 0}"
     class="alert alert-danger mt-3">
    <span th:text="${error}"></span>
</div>
<div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1></h1>
        <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#filterModal">
            <i class="bi bi-funnel"></i> Фильтры
        </button>
    </div>
    <!-- Сетка книг -->
    <div class="row">
        <!-- Карточки книг -->
        <div th:each="book : ${books}" class="col-md-6 col-lg-4 col-xl-3">
            <div class="book-card">
                <!-- Обложка книги -->
                <img th:src="@{/api/books/{id}/cover(id=${book.id})}"
                     class="img-fluid book-image"
                     alt="Обложка книги"
                     onerror="this.src='/img/default-cover.png'">

                <h5 class="book-title" th:text="${book.title}">Название книги</h5>
                <div class="book-author" th:text="${book.author != null} ? ${book.author.name} : 'Автор неизвестен'">
                    Автор
                </div>
                <div class="book-genres" th:text="${book.genre != null} ? ${book.genre.name} : 'Жанр не указан'">Жанр
                </div>
                <p class="book-description" th:text="${book.description} ?: 'Описание отсутствует'">
                    Описание книги...
                </p>
                <div class="d-flex flex-wrap">
                    <a th:href="@{'/read/' + ${book.id} + '?token=' + ${session.token}}"
                       th:if="${book.filePath != null && #strings.endsWith(book.filePath.toLowerCase(), '.txt')}"
                       class="btn btn-primary action-btn">
                        Читать онлайн
                    </a>

                    <!-- Скачивание -->
                    <a th:href="@{'/api/books/' + ${book.id} + '/download?token=' + ${session.token}}"
                       class="btn btn-outline-secondary action-btn">
                        Скачать
                    </a>
                    <form th:if="${isAuthenticated}"
                          th:action="@{/add-to-library}"
                          method="post"
                          style="display: inline;">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <button type="submit" class="btn btn-success action-btn">
                            <i class="bi bi-plus-circle"></i> В библиотеку
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- На будщее Слайдер -->

</div>

<!-- Heder -->
<footer class="footer">
    <div class="container text-center">
        <p class="mb-0">© 2025 iA.Book. All rights reserved.</p>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
