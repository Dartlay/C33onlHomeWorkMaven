<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Upload Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4 text-center">Upload Students from TXT File</h1>

    <div class="card shadow-sm mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <form th:action="@{/students/upload}" method="post" enctype="multipart/form-data" novalidate>
                <div class="mb-4">
                    <label for="fileInput" class="form-label">Select TXT File</label>
                    <input type="file" id="fileInput" name="file" class="form-control" accept=".txt" required/>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Upload</button>
                </div>
            </form>
            <div th:if="${message}" class="alert alert-info mt-4 text-center" th:text="${message}"></div>
            <div th:if="${error}" class="alert alert-danger mt-4 text-center" th:text="${error}"></div>
        </div>
    </div>

    <div class="mt-4 text-center">
        <a href="/students" class="btn btn-secondary px-4">Back to Students List</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
