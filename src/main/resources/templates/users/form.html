<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${user.id != null} ? 'Edit User' : 'Create User'">User Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<th:block th:insert="~{fragments/header :: header}"></th:block>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-4 text-center" th:text="${user.id != null} ? 'Edit User' : 'Create User'"></h2>
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <form th:action="@{${formAction}}" th:object="${user}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:if="${user.id != null}" th:field="*{id}"/>
                <div class="mb-3">
                    <label for="login" class="form-label">Login</label>
                    <input type="text" class="form-control" id="login" th:field="*{login}"
                           th:classappend="${#fields.hasErrors('login')} ? 'is-invalid' : ''"
                           autocomplete="username" required minlength="3" maxlength="20">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('login')}">
                        <span th:each="err : ${#fields.errors('login')}" th:text="${err}"></span>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                           autocomplete="name" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
                        <span th:each="err : ${#fields.errors('name')}" th:text="${err}"></span>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           autocomplete="email" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}">
                        <span th:each="err : ${#fields.errors('email')}" th:text="${err}"></span>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a th:href="@{/users}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-1"></i>
                        <span th:text="${user.id != null} ? 'Update' : 'Create'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
