<th:block th:insert="~{fragments/header :: header}"></th:block>

<div class="container">
    <h2 th:text="${user.id != null} ? 'Edit User' : 'Create User'"></h2>

    <form th:action="${user.id != null} ? @{/users/edit/{id}(id=${user.id})} : @{/users}"
          th:object="${user}" method="post" class="needs-validation" novalidate>

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="login" class="form-label">Login</label>
            <input type="text" class="form-control" id="login" th:field="*{login}" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('login')}"
                 th:errors="*{login}"></div>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/users" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
</body>
</html>
